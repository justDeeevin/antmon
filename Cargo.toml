[package]
name = "antmon"
version = "0.1.0"
edition = "2024"

[dependencies]
x11 = "2.21.0"
futures-core = "0.3.34"
thiserror = "2.0.21"
tracing = "0.1.44"
async-stream = "0.3.6"
derive_more = { version = "2.1.1", features = ["debug"] }
xkeysym = "0.2.1"
futures-util = "0.3.34"
win_key_codes = "0.1.2"
core-graphics = { version = "0.25.0", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
byor = { version = "5.0.0", default-features = false, features = ["fd", "fs"] }
derive_more = { version = "2.1.1", features = ["deref", "deref_mut"] }
pin-project = "1.1.13"

x11 = { version = "2.21.0", features = ["xlib", "xrecord", "xinput"] }

input = { version = "0.10.0", default-features = false, features = [
	"libinput_1_28",
] }
inotify = { version = "0.11.5", default-features = false }
smart-default = "0.7.1"

wayland-client = "0.31.15"
xkbcommon = "0.9.0"
memmap2 = "0.9.12"
wayland-protocols = { version = "0.32.13", features = ["client", "unstable"] }

[target.'cfg(target_os = "windows")'.dependencies]
byor = { version = "5.0.0", default-features = false, features = ["channel"] }
windows = { version = "0.62.2", features = [
	"Win32_UI_WindowsAndMessaging",
	"Win32_UI_Input_KeyboardAndMouse",
] }
windows-window = "0.100.0"
windows-core = { version = "0.62.2", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
byor = { version = "5.0.0", default-features = false, features = ["channel"] }
foreign-types = "0.5.0"

[target.x86_64-apple-darwin.dependencies]
core-foundation = { version = "0.10.1", default-features = false }

[target.aarch64-apple-darwin.dependencies]
core-graphics = "0.25.0"
core-foundation = "0.10.1"


[dev-dependencies]
tokio = { version = "1.53.2", features = ["rt", "macros"] }
smol = "2.0.2"
byor = { version = "5.0.0", default-features = false, features = [
	"tokio",
	"smol",
	"smol-oneshot",
] }
