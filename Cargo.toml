[package]
name = "antmon"
version = "0.1.0"
edition = "2024"

[dependencies]
x11 = "2.21.0"
futures-core = "0.3.34"
byor = { version = "2.0.0", default-features = false }
thiserror = "2.0.21"
tracing = "0.1.44"
async-stream = "0.3.6"

[target.'cfg(target_os = "linux")'.dependencies]
x11 = { version = "2.21.0", features = ["xlib", "xrecord"] }
byor = { version = "2.0.0", default-features = false, features = ["fd"] }

[dev-dependencies]
tokio = { version = "1.53.2", features = ["rt", "macros"] }
smol = "2.0.2"
futures-util = "0.3.34"
byor = { version = "2.0.0", default-features = false, features = [
	"smol",
	"tokio",
] }
