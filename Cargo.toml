[package]
name = "antmon"
version = "0.1.0"
edition = "2024"

[dependencies]
x11 = "2.21.0"
futures-core = "0.3.34"
byor = { version = "3.0.0", default-features = false }
thiserror = "2.0.21"
tracing = "0.1.44"
async-stream = "0.3.6"
derive_more = { version = "2.1.1", features = ["debug"] }
xkeysym = "0.2.1"

[target.'cfg(target_os = "linux")'.dependencies]
byor = { version = "3.0.0", default-features = false, features = ["fd", "fs"] }
derive_more = { version = "2.1.1", features = ["deref", "deref_mut"] }

x11 = { version = "2.21.0", features = ["xlib", "xrecord", "xinput"] }

input = { version = "0.10.0", default-features = false, features = [
	"libinput_1_19",
] }
async-stream = "0.3.6"
futures-util = "0.3.34"
inotify = { version = "0.11.5", default-features = false }

wayland-client = "0.31.15"
xkbcommon = "0.9.0"
memmap2 = "0.9.12"
wayland-protocols = { version = "0.32.13", features = ["client", "unstable"] }


[dev-dependencies]
tokio = { version = "1.53.2", features = ["rt", "macros"] }
smol = "2.0.2"
byor = { version = "3.0.0", default-features = false, features = [
	"tokio",
	"smol",
] }
